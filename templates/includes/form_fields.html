{% for field in form %}
<div class="field">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if not field.field.required %} <span class="text-muted fw-normal">(optional)</span>{% endif %}</label>
    {{ field.errors }}
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
{% endfor %}
